<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wimbo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>wimbo</h1>
    <p>music for everyone</p>

     <div class="app">

    <aside class="sidebar">
      <h2 class="logo">Wimbo</h2>
      <nav>
       <a href="#" id="home-link">Home</a>
        <a href="#">Search</a>
       <a href="#" id="liked-link">Liked Songs</a>
      </nav>
    </aside>

    <main class="main">
      <input type="text" id="search-input" class="search" placeholder="Search songs...">
      <h2>Popular Songs</h2>
      <div class="song-list">
        <!-- songs will go here later -->
      </div>
    </main>

    <footer class="player">
      <div class="now-playing">No song playing</div>
      <div class="controls">
       <button id="prev-btn">Prev</button>
<button id="play-btn">Play</button>
<button id="next-btn">Next</button>

 <div class="progress">
    <span id="current-time">0:00</span>
    <input type="range" id="progress-bar" min="0" max="100" step="0.1" value="0">
    <span id="duration">0:00</span>
  </div>
</div>

      </div>
     <div class="volume">
  <label for="volume-slider">Volume</label>
  <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
</div>
    </footer>

  </div>

    <script src="app.js"> </script>
    
</body>
</html>
