<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wimbo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>wimbo</h1>
    <p>music for everyone</p>

     <div class="app">

    <aside class="sidebar">
      <h2 class="logo">Wimbo</h2>
      <nav>
        <a href="#">Home</a>
        <a href="#">Search</a>
        <a href="#">Liked Songs</a>
      </nav>
    </aside>

    <main class="main">
      <input type="text" class="search" placeholder="Search songs...">
      <h2>Popular Songs</h2>
      <div class="song-list">
        <!-- songs will go here later -->
      </div>
    </main>

    <footer class="player">
      <div class="now-playing">No song playing</div>
      <div class="controls">
       <button id="prev-btn">Prev</button>
<button id="play-btn">Play</button>
<button id="next-btn">Next</button>
      </div>
      <div class="volume">Volume</div>
    </footer>

  </div>

    <script src="app.js"> </script>
    
</body>
</html>
